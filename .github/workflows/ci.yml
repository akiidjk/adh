name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  webhook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: webhook/go.mod
          cache-dependency-path: webhook/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run lint
      - run: bun run type-check
      - run: bun run test
      - run: bun run build
      - run: bun audit

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f compose.dev.yml config --quiet
