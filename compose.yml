services:
  webhook:
    build: ./webhook
    container_name: webhook
    ports:
      - "${WEBHOOK_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_DIR=/var/log/webhook
      - PORT=8000
      - WEBHOOK_PUBLIC_URL=${WEBHOOK_PUBLIC_URL:-http://localhost:8000}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - REDIS_ADDR=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - webhook_logs:/var/log/webhook
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - REDIS_ADDR=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - USER_ID=${USER_ID:-0}
      - USER_NAME=${USER_NAME}
      - USER_PASSWORD=${USER_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: redis
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    driver: local
  webhook_logs:
